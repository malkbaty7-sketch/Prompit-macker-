    <script>
      // Global capture-phase error shield to prevent cross-origin Script error noise in sandboxed iframes
      window.addEventListener(
        'error',
        function (event) {
          var msg = event && event.message ? String(event.message) : '';
          if (
            msg === 'Script error.' ||
            msg === 'Script error' ||
            msg.indexOf('ResizeObserver loop') !== -1 ||
            (!event.filename && !event.lineno && !event.colno)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return false;
          }
          console.warn('Forgeprom caught window error:', msg, event.filename, event.lineno);
        },
        true
      );
      window.addEventListener(
        'unhandledrejection',
        function (event) {
          console.warn('Forgeprom caught unhandled rejection:', event.reason);
        },
        true
      );
    </script>
